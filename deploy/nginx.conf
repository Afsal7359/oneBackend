# ---------------------------------------------------------------------------
# nginx site config for the oneBackend gateway.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/api
#   sudo ln -s /etc/nginx/sites-available/api /etc/nginx/sites-enabled/api
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.yourdomain.com     # adds the SSL block for you
#
# Replace api.yourdomain.com with your real API subdomain.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Certbot will rewrite this to redirect to HTTPS once the cert is issued.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # websocket upgrade (harmless if unused)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Product images / invoice uploads can be large.
    client_max_body_size 25m;

    # Stripe & Razorpay webhooks must reach the app with the body untouched —
    # nginx passes it through as-is, so nothing extra is needed here. Just make
    # sure the webhook URL you register includes the service prefix, e.g.
    #   https://api.yourdomain.com/crunz/api/payment/webhook
    #   https://api.yourdomain.com/underdwag/api/stripe/webhook
    #   https://api.yourdomain.com/ezone/api/payments/webhook
}
